<h1>{{ card.get_language_display }} card</h1>
<p>{{ card.transcript }}</p>
{% if card.source_media %}
  {% if card.is_video %}
    <video controls src="{{ card.source_media.url }}" style="max-width:100%;"></video>
  {% else %}
    <audio controls src="{{ card.source_media.url }}"></audio>
  {% endif %}
{% endif %}
